<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GB Downloader</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 360px; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px 12px; }
  header .text { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header .state { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
  .icon-btn {
    width: 34px; height: 34px; border: 0; border-radius: 50%; background: none; color: var(--sub);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn svg { width: 20px; height: 20px; }
  .actions { padding: 0 16px 14px; }
  .now { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .now .meta { color: var(--sub); font-size: 12.5px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #title { padding: 0 16px 4px; font-size: 13px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #empty { padding: 6px 16px 14px; }
  #msg { min-height: 20px; padding: 6px 16px 12px; font-size: 13px; color: var(--sub); }
  #msg.ok { color: var(--ok); }
  #msg.bad { color: var(--bad); }
  footer { padding: 4px 8px 8px; }
</style>
</head>
<body>
<header>
  <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m6.5 10 5.5 5.5 5.5-5.5"/><path d="M5 20h14"/></svg></span>
  <div class="text">
    <h1>GB Downloader</h1>
    <div class="state"><span id="dot" class="dot"></span><span id="state">Connecting to GB…</span></div>
  </div>
  <button id="options" class="icon-btn" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<div class="actions"><button id="page" class="btn">Send this page to GB</button></div>
<div class="divider"></div>
<div class="section-title now"><span>On this tab</span><span id="meta" class="meta"></span></div>
<div id="title"></div>
<div id="list"><div id="empty" class="hint">Nothing captured yet. Play the video, or switch its server or quality.</div></div>
<div id="msg"></div>
<div class="divider"></div>
<footer><button id="site" class="btn flat">Never use on this site</button></footer>
<script src="popup.js"></script>
</body>
</html>
